<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Event Portals</title>
  <link rel="stylesheet" href="web.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="portal-page">
    <section class="portal-shell">
      <p class="eyebrow">Event</p>
      <h1>Choose your portal</h1>
      <p class="subtitle">Use the buttons at the top to switch between student, organization, and admin access.</p>

      <div class="portal-switcher" role="tablist" aria-label="Portal selector">
        <button type="button" class="portal-tab active" data-role="student">Student</button>
        <button type="button" class="portal-tab" data-role="organization">Organization</button>
        <button type="button" class="portal-tab" data-role="admin">Admin</button>
      </div>

      <article class="portal-panel">
        <span class="portal-tag" id="portal-tag">Student</span>
        <h2 id="portal-title">Student Portal</h2>
        <p id="portal-description">Explore events, register quickly, and manage your student profile.</p>
        <div class="portal-actions">
          <a class="primary-btn" id="portal-login-link" href="../userpage/login.html">Login</a>
          <a class="secondary-btn" id="portal-signup-link" href="../userpage/signup.html">Sign Up</a>
        </div>
      </article>
    </section>
  </main>

  <script src="web.js"></script>
</body>
</html>
