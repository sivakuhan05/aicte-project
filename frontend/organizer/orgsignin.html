<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Organization Sign Up - Event</title>
    <link rel="stylesheet" href="orgsignin.css">
    <link rel="stylesheet" href="../shared/styles/chat-widget.css">
</head>
<body>
    <div class="signup-page">
        <section class="signup-card">
            <p class="eyebrow">Organization portal</p>
            <h1>Create organization account</h1>
            <p class="subtitle">Register with your name, club or association, official email address, and password. Admin approval is required before login.</p>

            <form id="form">
                <label class="field-label" for="username">Name</label>
                <div class="field">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm2 1a4 4 0 0 1 4 4v1H2v-1a4 4 0 0 1 4-4h4Z"/>
                    </svg>
                    <input type="text" id="username" name="username" placeholder="Enter your name" required>
                </div>

                <label class="field-label" for="email">Email Address</label>
                <div class="field">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v.217l-8 4.8-8-4.8V4Zm0 1.383v6.617a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5.383l-7.646 4.588a1 1 0 0 1-1.03 0L0 5.383Z"/>
                    </svg>
                    <input type="email" id="email" name="email" placeholder="name@organization.com" required>
                </div>

                <label class="field-label" for="club-association">Club / Association Name</label>
                <div class="field">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8.211.5a.5.5 0 0 0-.422 0l-7 3A.5.5 0 0 0 .5 3.96V4h15v-.04a.5.5 0 0 0-.289-.46l-7-3ZM15 5H1v7.5a.5.5 0 0 0 .5.5H3V7.5a.5.5 0 0 1 1 0V13h2V7.5a.5.5 0 0 1 1 0V13h2V7.5a.5.5 0 0 1 1 0V13h2V7.5a.5.5 0 0 1 1 0V13h1.5a.5.5 0 0 0 .5-.5V5ZM0 14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-.5H0V14Z"/>
                    </svg>
                    <input type="text" id="club-association" name="club-association" placeholder="Enter the club or association name" required>
                </div>

                <label class="field-label" for="password">Password</label>
                <div class="field">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 1a2 2 0 0 1 2 2v3H6V3a2 2 0 0 1 2-2Zm3 5V3a3 3 0 0 0-6 0v3a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2Z"/>
                    </svg>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                </div>

                <label class="field-label" for="confirm-password">Confirm Password</label>
                <div class="field">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 1a2 2 0 0 1 2 2v3H6V3a2 2 0 0 1 2-2Zm3 5V3a3 3 0 0 0-6 0v3a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2Z"/>
                    </svg>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter password" required>
                </div>

                <button type="submit" id="register" class="primary-btn">Create Account</button>
            </form>

            <p class="text-link">Already have an organization account? <a href="orglog.html">Log in</a></p>
            <p class="text-link"><a href="../landing/web.html">Choose another portal</a></p>
        </section>
    </div>

    <script src="orgsignin.js"></script>
    <script src="../shared/scripts/chat-widget.js"></script>
</body>
</html>
