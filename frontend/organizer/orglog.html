<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>Organization Login - Event</title>
    <link rel="stylesheet" href="orglog.css">
</head>
<body>
    <div class="login-page">
        <section class="login-card">
            <p class="eyebrow">Organization portal</p>
            <h1>Log in to Event</h1>
            <p class="subtitle">Use your approved organization email and password to continue to the dashboard.</p>

            <form id="form">
                <label class="field-label" for="email">Email address</label>
                <div class="field">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v.217l-8 4.8-8-4.8V4Zm0 1.383v6.617a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5.383l-7.646 4.588a1 1 0 0 1-1.03 0L0 5.383Z"/>
                    </svg>
                    <input autocomplete="off" placeholder="name@organization.com" id="email" type="email" required>
                </div>

                <label class="field-label" for="password">Password</label>
                <div class="field">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 1a2 2 0 0 1 2 2v3H6V3a2 2 0 0 1 2-2Zm3 5V3a3 3 0 0 0-6 0v3a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2Z"/>
                    </svg>
                    <input placeholder="Enter your password" id="password" type="password" required>
                </div>

                <button type="submit" class="primary-btn">Log In</button>
            </form>

            <p class="text-link">Need an organization account? <a href="orgsignin.html">Create one</a></p>
            <p class="text-link">Forgot your password? <a href="../public/orgforgot.html">Reset it here</a></p>
            <p class="text-link"><a href="../landing/web.html">Choose another portal</a></p>
        </section>
    </div>

    <script src="orglog.js"></script>
</body>
</html>
