<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organization Forgot Password | Event</title>
  <link rel="stylesheet" href="../shared/styles/auth.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <div class="auth-page">
    <section class="auth-card compact">
      <p class="eyebrow">Organization portal</p>
      <h1>Forgot Password</h1>
      <p class="subtitle">Enter your organization email to continue to password reset.</p>

      <form id="forgot-password-form" class="auth-form">
        <label class="field-group">
          <span class="field-label">Email Address</span>
          <div class="field">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
              <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v.217l-8 4.8-8-4.8V4Zm0 1.383v6.617a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5.383l-7.646 4.588a1 1 0 0 1-1.03 0L0 5.383Z"/>
            </svg>
            <input type="email" id="email" placeholder="name@organization.com" required />
          </div>
        </label>
        <button class="primary-btn" type="submit">Continue</button>
      </form>

      <p class="text-link">Remember your password? <a href="../organizer/orglog.html">Log in</a></p>
      <p class="text-link"><a href="../landing/web.html">Choose another portal</a></p>
    </section>
  </div>

  <script>
    document.getElementById("forgot-password-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const submitBtn = document.querySelector('#forgot-password-form button');

        if (!email) {
            alert("Please enter a valid email address.");
            return;
        }

        try {
            submitBtn.disabled = true;
            submitBtn.textContent = "Preparing...";

            const response = await fetch("http://localhost:3000/org/forgot-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "Could not continue to password reset.");
            }

            if (data.token) {
                const resetUrl = `http://localhost:3000/orgreset.html?token=${encodeURIComponent(data.token)}&email=${encodeURIComponent(data.email || email)}`;
                window.location.href = resetUrl;
                return;
            }

            alert("No reset session could be created for this email.");
        } catch (err) {
            console.error("Error:", err);
            alert(err.message || "Failed to continue to password reset.");
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Continue";
        }
    });
</script>
</body>

</html>
