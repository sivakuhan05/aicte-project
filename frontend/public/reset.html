<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Reset Password | Event</title>
  <link rel="stylesheet" href="../shared/styles/auth.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/styles/chat-widget.css">
</head>
<body>
  <div class="auth-page">
    <section class="auth-card compact">
      <p class="eyebrow">Student portal</p>
      <h1>Reset Password</h1>
      <p class="subtitle">Enter your new student password to finish the reset.</p>

      <form id="reset-form" class="auth-form">
        <input type="hidden" id="token">
        <input type="hidden" id="email">

        <label class="field-group">
          <span class="field-label">New Password</span>
          <div class="field">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 1a2 2 0 0 1 2 2v3H6V3a2 2 0 0 1 2-2Zm3 5V3a3 3 0 0 0-6 0v3a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2Z"/>
            </svg>
            <input type="password" id="password" placeholder="New password" required>
          </div>
        </label>

        <label class="field-group">
          <span class="field-label">Confirm Password</span>
          <div class="field">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 1a2 2 0 0 1 2 2v3H6V3a2 2 0 0 1 2-2Zm3 5V3a3 3 0 0 0-6 0v3a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2Z"/>
            </svg>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>
          </div>
        </label>

        <button type="submit" class="primary-btn">Reset Password</button>
      </form>

      <p class="text-link"><a href="../landing/web.html">Choose another portal</a></p>
    </section>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const email = params.get('email');
      
      if (!token || !email) {
        alert("Invalid reset link. Please request a new one.");
        window.location.href = "forgot.html";
        return;
      }
      
      document.getElementById('token').value = token;
      document.getElementById('email').value = decodeURIComponent(email);
    });

    document.getElementById("reset-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      
      const token = document.getElementById('token').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (password !== confirmPassword) {
        alert("Passwords don't match!");
        return;
      }

      try {
        // Show loading state
        const submitBtn = document.querySelector('#reset-form button');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Processing...';

        const response = await fetch('http://localhost:3000/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            token, 
            email, 
            newPassword: password 
          }),
        });

        const data = await response.json();
        
        if (response.ok && data.success) {
          alert("Password reset successfully!");
          window.location.href = "../student/login.html";
        } else {
          alert(data.message || data.error || "Password reset failed");
        }
      } catch (err) {
        console.error("Error:", err);
        alert("Error resetting password. Please try again.");
      } finally {
        // Reset button state
        const submitBtn = document.querySelector('#reset-form button');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      }
    });
  </script>
    <script src="../shared/scripts/chat-widget.js"></script>
</body>
</html>
