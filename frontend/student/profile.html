<!DOCTYPE html>

<head>

                    </svg>
                </button>
            </li>
            <li>
                <a href="dashboard.html">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 4.5v15m6-15v15m-10.875 0h15.75c.621 0 1.125-.504 1.125-1.125V5.625c0-.621-.504-1.125-1.125-1.125H4.125C3.504 4.5 3 5.004 3 5.625v12.75c0 .621.504 1.125 1.125 1.125Z" />
                    </svg>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="next-events.html">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                    </svg>
                    <span>Event</span>
                </a>
            </li>
            <li>
                <a href="my-events.html">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
                    </svg>
                    <span>My Events</span>
                </a>
            </li>
            <li class="active">

                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                    </svg>
                    <span>Profile</span>
                </a>
            </li>
            <li>
                <a href="https://notes-market-nine.vercel.app/">

                    </svg>
                    <span>Notes Market</span>
                </a>
            </li>
            <li class="logout-item">
                <a href="login.html" data-student-logout>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">

                </a>
            </li>
        </ul>
    </nav>

    <main>
        <section class="profile-shell container">
            <div class="profile-hero">
                <div class="profile-identity">
                    <div class="profile-avatar" id="profile-avatar">ST</div>
                    <div>
                        <p class="eyebrow">Student profile</p>
                        <h1 id="profile-hero-name">Student</h1>
                        <p class="hero-copy" id="profile-hero-email">Not set</p>
                    </div>
                </div>
                <button type="button" class="btn-primary" id="edit-profile-btn">Edit Profile</button>
            </div>

            <div class="profile-grid" id="profile-view">
                <article class="detail-card">
                    <strong>Full Name</strong>
                    <p id="profile-name">Not set</p>
                </article>
                <article class="detail-card">
                    <strong>Email Address</strong>
                    <p id="profile-email">Not set</p>
                </article>
                <article class="detail-card">
                    <strong>Gender</strong>
                    <p id="profile-gender">Not set</p>
                </article>
                <article class="detail-card">
                    <strong>Department</strong>
                    <p id="profile-department">Not set</p>
                </article>
                <article class="detail-card detail-card-full">
                    <strong>Interested Domains</strong>
                    <div id="profile-interests" class="profile-interest-block"></div>
                </article>
            </div>

            <form id="profile-form" class="profile-form hidden">
                <div class="profile-form-grid">
                    <label>
                        Full Name
                        <input type="text" id="student-name" required>
                    </label>
                    <label>
                        Email Address
                        <input type="email" id="student-email" required>
                    </label>
                    <label>
                        Gender
                        <select id="student-gender" required>
                            <option value="">Select gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                            <option value="Prefer not to say">Prefer not to say</option>
                        </select>
                    </label>
                    <label>
                        Department
                        <select id="student-department" required>
                            <option value="">Select department</option>
                            <option value="CSE">CSE</option>
                            <option value="IT">IT</option>
                            <option value="MECH">MECH</option>
                            <option value="ECE">ECE</option>
                            <option value="AIML">AIML</option>
                        </select>
                    </label>
                    <div class="full-width">
                        <span class="field-label-inline">Interested Domains</span>
                        <div class="student-interest-picker">
                            <label><input type="checkbox" name="interest" value="Tech"><span>Tech</span></label>
                            <label><input type="checkbox" name="interest" value="Non-Tech"><span>Non-Tech</span></label>
                            <label><input type="checkbox" name="interest" value="Food"><span>Food</span></label>
                            <label><input type="checkbox" name="interest" value="Sports"><span>Sports</span></label>
                            <label><input type="checkbox" name="interest" value="Music"><span>Music</span></label>
                            <label><input type="checkbox" name="interest" value="Arts"><span>Arts</span></label>
                            <label><input type="checkbox" name="interest" value="General"><span>General</span></label>
                        </div>
                    </div>
                </div>
                <div class="form-actions profile-actions">
                    <button type="button" class="btn-outline" id="cancel-profile-btn">Cancel</button>
                    <button type="submit" class="btn-primary">Save Changes</button>
                </div>
            </form>
        </section>
    </main>

    <script src="student-shared.js"></script>
    <script src="profile.js"></script>
    <script src="../shared/scripts/sidebar.js"></script>
    <script src="../shared/scripts/chat-widget.js"></script>
</body>
</html>
